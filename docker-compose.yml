services:

  db:
    image: postgis/postgis:16-3.4
    container_name: earthdata-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: earthdata_mcp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d earthdata_mcp"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: redis:7-alpine
    container_name: earthdata-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mcp:
    build: .
    container_name: earthdata-mcp
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${DB_PASSWORD:-postgres}@db:5432/earthdata_mcp
      REDIS_URL: redis://redis:6379/0
      EARTHDATA_DATA_DIR: /data
      EARTHDATA_MCP_TRANSPORT: ${EARTHDATA_MCP_TRANSPORT:-stdio}
      EARTHDATA_MCP_HOST: ${EARTHDATA_MCP_HOST:-0.0.0.0}
      EARTHDATA_MCP_PORT: ${EARTHDATA_MCP_PORT:-8765}
      EARTHDATA_MCP_TOKEN: ${EARTHDATA_MCP_TOKEN:-}
    ports:
      - "${EARTHDATA_MCP_PORT:-8765}:${EARTHDATA_MCP_PORT:-8765}"
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      # Read-only: maintenance scripts need this container's DB access and deps,
      # but nothing in the image may write back to the repo.
      - ./scripts:/app/scripts:ro
      - data:/data          # local storage backend root (default)
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - default
      - earthdata_net
    # stdio (default) has no server process for compose to run — the container
    # stays up idle so the gate can `docker compose exec` into it, and an MCP
    # client spawns the server itself as a child process. Under
    # EARTHDATA_MCP_TRANSPORT=http, this *is* the server process: a second
    # compose stack attaches over `earthdata_net` at http://mcp:${EARTHDATA_MCP_PORT}/mcp.
    command:
      - sh
      - -c
      - |
        if [ "$$EARTHDATA_MCP_TRANSPORT" = "http" ]; then
          exec python -m earthdata_mcp.server
        else
          exec sleep infinity
        fi

  worker:
    build: .
    container_name: earthdata-worker
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${DB_PASSWORD:-postgres}@db:5432/earthdata_mcp
      REDIS_URL: redis://redis:6379/0
      EARTHDATA_DATA_DIR: /data
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - data:/data
    depends_on:
      redis:
        condition: service_healthy
    command: ["arq", "earthdata_mcp.jobs.worker.WorkerSettings"]

  # Optional S3-compatible object store for exercising ObjectStoreBackend.
  # Off by default: starts only with `docker compose --profile s3 up`.
  minio:
    image: minio/minio:latest
    container_name: earthdata-minio
    profiles: ["s3"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

networks:
  # Fixed name (not project-prefixed) so a second, independent compose stack
  # (e.g. Talking-to-Air) can join it — declare `earthdata_net: {external: true}`
  # on that stack's side; this stack creates it on first `docker compose up`.
  earthdata_net:
    name: earthdata_net

volumes:
  pg_data:
  # Fixed name so a second compose stack can mount it at the same absolute
  # path (/data) and resolve `export_result`'s `file://` URIs as a plain
  # filesystem read — declare `earthdata_data: {external: true}` there.
  data:
    name: earthdata_data
  minio_data:
